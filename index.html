<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乐博经营数据查询看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="city_data.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI','Microsoft YaHei',sans-serif; background:#f0f2f5; color:#333; }
.header { background:linear-gradient(135deg,#1a237e,#283593); color:#fff; padding:18px 28px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
.header h1 { font-size:22px; font-weight:600; }
.header .subtitle { font-size:12px; opacity:.8; margin-top:3px; }

/* 筛选区 */
.filter-bar { background:#fff; padding:14px 28px; border-bottom:1px solid #e0e0e0; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
.filter-group { display:flex; flex-direction:column; gap:4px; }
.filter-group label { font-size:12px; color:#666; font-weight:500; }
.filter-group select { padding:6px 12px; border:1px solid #d0d0d0; border-radius:6px; font-size:13px; background:#fff; min-width:90px; cursor:pointer; transition:border-color .2s; }
.filter-group select:hover { border-color:#5c6bc0; }
.filter-group select:focus { border-color:#1a237e; outline:none; }

.btn-query { padding:7px 24px; background:#1a237e; color:#fff; border:none; border-radius:6px; font-size:14px; cursor:pointer; transition:background .2s; }
.btn-query:hover { background:#283593; }

/* 汇总卡片 */
.summary-section { padding:18px 28px; display:flex; gap:14px; flex-wrap:wrap; }
.summary-card { background:#fff; border-radius:10px; padding:16px 20px; min-width:160px; box-shadow:0 1px 4px rgba(0,0,0,.08); flex:1; }
.summary-card .label { font-size:12px; color:#888; margin-bottom:6px; }
.summary-card .value { font-size:24px; font-weight:700; color:#1a237e; }
.summary-card .unit { font-size:13px; color:#999; font-weight:400; margin-left:3px; }
.summary-card.highlight .value { color:#c62828; }

/* 主内容区 */
.main-content { padding:0 28px 28px; }
.section-title { font-size:15px; font-weight:600; color:#333; margin:18px 0 10px; padding-left:10px; border-left:4px solid #1a237e; }

/* 图表区 */
.chart-container { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:16px; }
.chart-container canvas { max-height:360px; }

/* 表格区 */
.table-container { background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th { background:#f5f5f5; padding:10px 12px; text-align:right; font-weight:600; color:#555; border-bottom:2px solid #e0e0e0; white-space:nowrap; position:sticky; top:0; }
thead th:first-child, thead th:nth-child(2) { text-align:left; }
tbody td { padding:8px 12px; text-align:right; border-bottom:1px solid #f0f0f0; white-space:nowrap; }
tbody td:first-child, tbody td:nth-child(2) { text-align:left; }
tbody tr:hover { background:#f9f9ff; }
tbody tr.total-row { font-weight:700; background:#e8eaf6; color:#1a237e; }
.positive { color:#c62828; }
.negative { color:#2e7d32; }

/* 信息提示 */
.info-bar { padding:8px 28px; font-size:12px; color:#888; display:flex; justify-content:space-between; align-items:center; }
.info-bar .record-count { background:#e8eaf6; padding:3px 10px; border-radius:12px; color:#1a237e; font-weight:500; }

/* 滚动 */
.table-scroll { max-height:560px; overflow:auto; }

/* 响应式 */
@media (max-width:768px) {
  .filter-bar { flex-direction:column; align-items:stretch; }
  .summary-card { min-width:140px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>乐博经营数据查询看板</h1>
  <div class="subtitle">城市级 · 2021-2026 · 21项指标 · 22个城市</div>
</div>

<!-- 筛选区 -->
<div class="filter-bar">
  <div class="filter-group">
    <label>年份</label>
    <select id="yearSelect"></select>
  </div>

  <div class="filter-group">
    <label>起始月</label>
    <select id="startMonth"></select>
  </div>

  <div class="filter-group">
    <label>结束月</label>
    <select id="endMonth"></select>
  </div>

  <div class="filter-group">
    <label>城市</label>
    <select id="citySelect"></select>
  </div>

  <div class="filter-group">
    <label>指标</label>
    <select id="indicatorSelect"></select>
  </div>

  <button class="btn-query" onclick="query()">查 询</button>
</div>

<!-- 信息栏 -->
<div class="info-bar">
  <span id="queryDesc">请选择条件后点击查询</span>
  <span class="record-count" id="recordCount">0 条</span>
</div>

<!-- 汇总卡片 -->
<div class="summary-section" id="summarySection"></div>

<!-- 主内容 -->
<div class="main-content">
  <div id="chartArea" style="display:none;">
    <div class="section-title" id="chartTitle">趋势图</div>
    <div class="chart-container">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

  <div class="section-title" id="tableTitle">数据明细</div>
  <div class="table-container">
    <div class="table-scroll">
      <table id="dataTable">
        <thead><tr><th>城市</th><th>指标</th></tr></thead>
        <tbody><tr><td colspan="2" style="text-align:center;color:#999;padding:30px;">点击查询按钮加载数据</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const DATA = window.__CITY_DATA__;
const MONTHS = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const MONEY_INDICATORS = ['预收','净预收','复购净预收','新招生预收','课耗','净利润','收入','人工成本','变动成本','固定成本','房租费用','教具成本','教具收入','测评预收','比赛预收','测评课耗','比赛课耗','现金流净额'];
let trendChart = null;

// ===== 初始化下拉框 =====
function initSelects() {
  // 年份
  const yearSel = document.getElementById('yearSelect');
  DATA.years.forEach(y => {
    yearSel.appendChild(new Option(y + '年', y));
  });
  yearSel.value = DATA.years[DATA.years.length - 1];

  // 月份
  const startSel = document.getElementById('startMonth');
  const endSel = document.getElementById('endMonth');
  MONTHS.forEach(m => {
    startSel.appendChild(new Option(m, m));
    endSel.appendChild(new Option(m, m));
  });
  startSel.value = '1月';
  endSel.value = '7月';

  // 城市
  const citySel = document.getElementById('citySelect');
  citySel.appendChild(new Option('全部城市', 'all'));
  DATA.cities.forEach(c => citySel.appendChild(new Option(c, c)));

  // 指标
  const indSel = document.getElementById('indicatorSelect');
  indSel.appendChild(new Option('全部指标', 'all'));
  DATA.indicators.forEach(i => indSel.appendChild(new Option(i, i)));
}

// ===== 数值格式化 =====
function fmtRaw(val, decimals) {
  if (val === null || val === undefined || val === '' || isNaN(val)) return '—';
  return val.toFixed(decimals || 2);
}

function isMoneyIndicator(ind) {
  return MONEY_INDICATORS.includes(ind);
}

function valClass(val, isMoney) {
  if (!isMoney || val === null || val === undefined || isNaN(val)) return '';
  return val > 0 ? 'positive' : (val < 0 ? 'negative' : '');
}

// ===== 查询 =====
function query() {
  const year = parseInt(document.getElementById('yearSelect').value);
  const city = document.getElementById('citySelect').value;
  const indicator = document.getElementById('indicatorSelect').value;
  const startM = document.getElementById('startMonth').value;
  const endM = document.getElementById('endMonth').value;
  const si = MONTHS.indexOf(startM);
  const ei = MONTHS.indexOf(endM);

  if (si > ei) { alert('起始月不能晚于结束月'); return; }

  const monthList = MONTHS.slice(si, ei + 1);
  const isSingleMonth = monthList.length === 1;

  let desc = isSingleMonth ? `${year}年 ${startM}` : `${year}年 ${startM}-${endM} 累计`;
  let cityDesc = city === 'all' ? '全部城市' : city;
  let indDesc = indicator === 'all' ? '全部指标' : indicator;
  document.getElementById('queryDesc').textContent = `${desc} | ${cityDesc} | ${indDesc}`;

  // 过滤数据
  let filtered = DATA.records.filter(r => r['年份'] === year);
  if (city !== 'all') filtered = filtered.filter(r => r['城市'] === city);
  if (indicator !== 'all') filtered = filtered.filter(r => r['指标'] === indicator);

  // 计算每条记录的累计值
  let results = filtered.map(r => {
    let sum = 0;
    let hasData = false;
    const monthlyVals = {};
    monthList.forEach(m => {
      const v = r[m];
      monthlyVals[m] = v;
      if (v !== null && v !== undefined && v !== '' && !isNaN(v)) {
        sum += parseFloat(v);
        hasData = true;
      }
    });
    return {
      城市: r['城市'],
      指标: r['指标'],
      年份: year,
      累计: hasData ? sum : null,
      月度: monthlyVals
    };
  });

  document.getElementById('recordCount').textContent = `${results.length} 条`;

  // 渲染
  renderSummary(results, indicator, monthList);
  renderTable(results, monthList, indicator, city, isSingleMonth);

  // 趋势图：仅多月时显示
  if (!isSingleMonth) {
    renderChart(results, monthList, city, indicator);
  } else {
    document.getElementById('chartArea').style.display = 'none';
    if (trendChart) { trendChart.destroy(); trendChart = null; }
  }
}

// ===== 渲染汇总卡片 =====
function renderSummary(results, indicator, monthList) {
  const section = document.getElementById('summarySection');
  section.innerHTML = '';
  const isMulti = monthList.length > 1;

  let keyIndicators;
  if (indicator !== 'all') {
    keyIndicators = [indicator];
  } else {
    const preferred = ['新招生', '预收', '复购净预收', '课耗', '净利润'];
    keyIndicators = preferred.filter(i => results.some(r => r['指标'] === i));
    if (keyIndicators.length < 5) {
      const others = [...new Set(results.map(r => r['指标']))].filter(i => !keyIndicators.includes(i));
      keyIndicators = keyIndicators.concat(others.slice(0, 5 - keyIndicators.length));
    }
  }

  keyIndicators.forEach(ind => {
    const indResults = results.filter(r => r['指标'] === ind);
    const total = indResults.reduce((sum, r) => {
      if (r['累计'] !== null && !isNaN(r['累计'])) return sum + r['累计'];
      return sum;
    }, 0);
    const hasData = indResults.some(r => r['累计'] !== null);

    const card = document.createElement('div');
    card.className = 'summary-card' + (ind === '净利润' ? ' highlight' : '');

    let displayVal = '—';
    let unit = '';
    if (hasData) {
      if (MONEY_INDICATORS.includes(ind) && Math.abs(total) >= 10000) {
        displayVal = (total / 10000).toFixed(1);
        unit = '万';
      } else {
        displayVal = total.toFixed(0);
      }
    }

    card.innerHTML = `
      <div class="label">${ind}${isMulti ? ' 累计' : ''}</div>
      <div class="value">${displayVal}<span class="unit">${unit}</span></div>
    `;
    section.appendChild(card);
  });
}

// ===== 渲染表格 =====
function renderTable(results, monthList, indicator, city, isSingleMonth) {
  const table = document.getElementById('dataTable');
  const thead = table.querySelector('thead');
  const tbody = table.querySelector('tbody');
  const tableTitle = document.getElementById('tableTitle');

  // ===== 单月 + 特定指标 + 全部城市 → 城市排名表（降序）=====
  if (isSingleMonth && indicator !== 'all' && city === 'all') {
    tableTitle.textContent = `${indicator} 各城市排名 (${monthList[0]})`;
    thead.innerHTML = `<tr><th>排名</th><th>城市</th><th>${indicator}</th></tr>`;

    let sorted = results.filter(r => r['累计'] !== null && !isNaN(r['累计']));
    sorted.sort((a, b) => b['累计'] - a['累计']);

    const isMoney = isMoneyIndicator(indicator);
    let bodyHTML = '';
    let total = 0;
    sorted.forEach((r, idx) => {
      const val = r['累计'];
      total += val;
      bodyHTML += `<tr><td style="font-weight:600;color:#999;width:50px;">${idx + 1}</td><td>${r['城市']}</td><td class="${valClass(val, isMoney)}" style="font-weight:600;">${fmtRaw(val, 2)}</td></tr>`;
    });

    if (sorted.length > 1) {
      bodyHTML += `<tr class="total-row"><td></td><td>合计 (${sorted.length}城)</td><td class="${valClass(total, isMoney)}">${fmtRaw(total, 2)}</td></tr>`;
    }

    if (sorted.length === 0) {
      bodyHTML = `<tr><td colspan="3" style="text-align:center;color:#999;padding:30px;">没有匹配的数据</td></tr>`;
    }
    tbody.innerHTML = bodyHTML;
    return;
  }

  // ===== 单月 + 特定城市 + 全部指标 → 该城市指标明细表 =====
  if (isSingleMonth && city !== 'all' && indicator === 'all') {
    tableTitle.textContent = `${city} 各指标明细 (${monthList[0]})`;
    thead.innerHTML = `<tr><th>指标</th><th>${monthList[0]}</th></tr>`;

    const indOrder = DATA.indicators;
    let sorted = results.slice().sort((a, b) => indOrder.indexOf(a['指标']) - indOrder.indexOf(b['指标']));

    let bodyHTML = '';
    sorted.forEach(r => {
      const val = r['月度'][monthList[0]];
      const isMoney = isMoneyIndicator(r['指标']);
      bodyHTML += `<tr><td>${r['指标']}</td><td class="${valClass(val, isMoney)}" style="font-weight:600;">${fmtRaw(val, 2)}</td></tr>`;
    });

    if (sorted.length === 0) {
      bodyHTML = `<tr><td colspan="2" style="text-align:center;color:#999;padding:30px;">没有匹配的数据</td></tr>`;
    }
    tbody.innerHTML = bodyHTML;
    return;
  }

  // ===== 通用表格（多月 或 单月全部城市全部指标）=====
  const isMulti = monthList.length > 1;
  tableTitle.textContent = isMulti ? '数据明细（含各月及累计）' : '数据明细';

  let headerHTML = '<tr><th>城市</th><th>指标</th>';
  if (isMulti) {
    monthList.forEach(m => headerHTML += `<th>${m}</th>`);
    headerHTML += '<th>累计</th>';
  } else {
    headerHTML += `<th>${monthList[0]}</th>`;
  }
  headerHTML += '</tr>';
  thead.innerHTML = headerHTML;

  // 排序: 按城市分组, 每组内按指标顺序
  const cityOrder = DATA.cities;
  const indOrder = DATA.indicators;
  results.sort((a, b) => {
    const ci = cityOrder.indexOf(a['城市']) - cityOrder.indexOf(b['城市']);
    if (ci !== 0) return ci;
    return indOrder.indexOf(a['指标']) - indOrder.indexOf(b['指标']);
  });

  // 计算合计
  let totals = {};
  results.forEach(r => {
    if (r['累计'] !== null && !isNaN(r['累计'])) {
      if (!totals[r['指标']]) totals[r['指标']] = { sum: 0, monthly: {} };
      totals[r['指标']].sum += r['累计'];
      monthList.forEach(m => {
        const v = r['月度'][m];
        if (v !== null && v !== undefined && !isNaN(v)) {
          totals[r['指标']].monthly[m] = (totals[r['指标']].monthly[m] || 0) + parseFloat(v);
        }
      });
    }
  });

  // 数据行
  let bodyHTML = '';
  results.forEach(r => {
    const isMoney = isMoneyIndicator(r['指标']);
    bodyHTML += `<tr><td>${r['城市']}</td><td>${r['指标']}</td>`;
    if (isMulti) {
      monthList.forEach(m => {
        bodyHTML += `<td>${fmtRaw(r['月度'][m], 0)}</td>`;
      });
      bodyHTML += `<td class="${valClass(r['累计'], isMoney)}" style="font-weight:600;">${fmtRaw(r['累计'], 0)}</td>`;
    } else {
      const v = r['月度'][monthList[0]];
      bodyHTML += `<td class="${valClass(v, isMoney)}" style="font-weight:600;">${fmtRaw(v, 0)}</td>`;
    }
    bodyHTML += `</tr>`;
  });

  // 合计行
  const showTotal = results.length > 1 && (indicator !== 'all' || city !== 'all');
  if (showTotal && city === 'all') {
    const groupedIndicators = [...new Set(results.map(r => r['指标']))];
    groupedIndicators.forEach(ind => {
      const t = totals[ind];
      if (!t) return;
      const isMoney = isMoneyIndicator(ind);
      bodyHTML += `<tr class="total-row"><td>合计</td><td>${ind}</td>`;
      if (isMulti) {
        monthList.forEach(m => {
          bodyHTML += `<td>${fmtRaw(t.monthly[m], 0)}</td>`;
        });
        bodyHTML += `<td>${fmtRaw(t.sum, 0)}</td>`;
      } else {
        bodyHTML += `<td>${fmtRaw(t.monthly[monthList[0]], 0)}</td>`;
      }
      bodyHTML += `</tr>`;
    });
  }

  if (results.length === 0) {
    bodyHTML = `<tr><td colspan="${monthList.length + 3}" style="text-align:center;color:#999;padding:30px;">没有匹配的数据</td></tr>`;
  }
  tbody.innerHTML = bodyHTML;
}

// ===== 渲染趋势图 =====
function renderChart(results, monthList, city, indicator) {
  const chartArea = document.getElementById('chartArea');
  chartArea.style.display = '';

  let title = '';
  if (indicator !== 'all') {
    title = `${indicator} - 月度趋势 (${monthList[0]}-${monthList[monthList.length-1]})`;
  } else {
    title = `期间趋势 (${monthList[0]}-${monthList[monthList.length-1]})`;
  }
  document.getElementById('chartTitle').textContent = title;

  const ctx = document.getElementById('trendChart').getContext('2d');
  if (trendChart) trendChart.destroy();

  let datasets = [];
  let labels = monthList;
  const colors = ['#1a237e','#c62828','#2e7d32','#f57f17','#6a1b9a','#00838f','#e65100','#455a64','#ad1457','#283593','#bf360c','#00695c','#4e342e','#37474f','#827717','#004d40','#26418f','#b71c1c','#1b5e20','#e65100','#424242'];

  if (indicator !== 'all') {
    // 单指标: 每个城市一条线
    if (city === 'all') {
      const chartCities = [...new Set(results.map(r => r['城市']))];
      chartCities.forEach((c, idx) => {
        const cityResult = results.find(r => r['城市'] === c && r['指标'] === indicator);
        if (cityResult) {
          const data = monthList.map(m => {
            const v = cityResult['月度'][m];
            return (v !== null && v !== undefined && !isNaN(v)) ? parseFloat(v) : null;
          });
          datasets.push({
            label: c, data: data,
            borderColor: colors[idx % colors.length],
            backgroundColor: colors[idx % colors.length] + '20',
            borderWidth: 2, tension: 0.3, fill: false, spanGaps: true
          });
        }
      });
    } else {
      const data = monthList.map(m => {
        const v = results[0] && results[0]['月度'][m];
        return (v !== null && v !== undefined && !isNaN(v)) ? parseFloat(v) : null;
      });
      datasets.push({
        label: `${city} - ${indicator}`, data: data,
        borderColor: colors[0], backgroundColor: colors[0] + '20',
        borderWidth: 2, tension: 0.3, fill: true, spanGaps: true
      });
    }
  } else {
    // 全指标: 各指标趋势
    const allIndicators = [...new Set(results.map(r => r['指标']))];
    allIndicators.forEach((ind, idx) => {
      const indResults = results.filter(r => r['指标'] === ind);
      const data = monthList.map(m => {
        let sum = 0, hasData = false;
        indResults.forEach(r => {
          const v = r['月度'][m];
          if (v !== null && v !== undefined && !isNaN(v)) { sum += parseFloat(v); hasData = true; }
        });
        return hasData ? sum : null;
      });
      datasets.push({
        label: ind, data: data,
        borderColor: colors[idx % colors.length],
        backgroundColor: colors[idx % colors.length] + '30',
        borderWidth: 2, tension: 0.3, fill: false, spanGaps: true
      });
    });
  }

  const showLegend = datasets.length <= 12;

  trendChart = new Chart(ctx, {
    type: 'line',
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: showLegend, position: 'top', labels: { font: { size: 11 }, boxWidth: 12, padding: 8 } },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              let val = ctx.parsed.y;
              if (val === null) return null;
              let label = ctx.dataset.label + ': ';
              if (Math.abs(val) >= 10000) { label += (val / 10000).toFixed(1) + '万'; }
              else { label += val.toFixed(0); }
              return label;
            }
          }
        }
      },
      scales: {
        y: {
          ticks: {
            callback: function(val) {
              if (Math.abs(val) >= 10000) return (val / 10000).toFixed(0) + '万';
              return val;
            }
          }
        }
      }
    }
  });
}

// ===== 初始化 =====
initSelects();
query();
</script>

</body>
</html>
